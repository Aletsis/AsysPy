services:
  # Demonio / Worker en Segundo Plano 24/7 de AsistPy
  asistpy-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: asistpy-worker
    restart: unless-stopped
    environment:
      - PERSISTENCE_BACKEND=postgres
      - DATABASE_URL=postgresql+psycopg://postgres:postgrespassword@postgres:5432/asistpy
      - SYNC_INTERVAL_SECONDS=300
      - NIGHTLY_PROCESSING_TIME=23:59
      - ZK_TIMEOUT=60
      - SYNC_STOP_ON_ERROR=false
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - asistpy_data:/app/data

  # Base de Datos PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: asistpy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: asistpy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d asistpy"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Base de Datos MySQL
  mysql:
    image: mysql:8.4
    container_name: asistpy-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: asistpy
      MYSQL_USER: asistpy
      MYSQL_PASSWORD: asistpypassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # Base de Datos NoSQL MongoDB
  mongodb:
    image: mongo:7.0
    container_name: asistpy-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: mongopassword
      MONGO_INITDB_DATABASE: asistpy
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  asistpy_data:
  postgres_data:
  mysql_data:
  mongo_data:
