name: Build Multiplatform Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Desktop for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: asistpy-linux-x64
            asset_name: asistpy-linux-x64.tar.gz
          - os: windows-latest
            artifact_name: asistpy-windows-x64
            asset_name: asistpy-windows-x64.zip
          - os: macos-latest
            artifact_name: asistpy-macos-x64
            asset_name: asistpy-macos-x64.tar.gz

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[desktop,all]" pyinstaller

      - name: Build Desktop Executable with PyInstaller
        run: |
          python scripts/package/build_desktop.py --clean

      - name: Compress Build Artifacts (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          cd dist
          tar -czvf ../${{ matrix.asset_name }} AsistPy/

      - name: Compress Build Artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path dist/AsistPy -DestinationPath ${{ matrix.asset_name }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_name }}
