[project]
name = "asistpy"
version = "0.1.0"
description = "Servicio de control de asistencia para relojes biometricos, diseñado para ejecutarse en distintos tipos de plataforma."
authors = [
    {name = "Alexis Barron",email = "alexis.barron.luna@gmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyzk (>=0.9,<0.10)",
    "sqlalchemy (>=2.0.0,<3.0.0)",
]

[project.optional-dependencies]
cli = ["sqlalchemy (>=2.0.0,<3.0.0)"]
sqlite = ["sqlalchemy (>=2.0.0,<3.0.0)"]
postgres = ["sqlalchemy (>=2.0.0,<3.0.0)", "psycopg[binary] (>=3.1.0)"]
mysql = ["sqlalchemy (>=2.0.0,<3.0.0)", "pymysql (>=1.1.0)"]
sqlserver = ["sqlalchemy (>=2.0.0,<3.0.0)", "pyodbc (>=5.0.0)"]
mongo = ["pymongo (>=4.6.0)"]
all = [
    "sqlalchemy (>=2.0.0,<3.0.0)",
    "psycopg[binary] (>=3.1.0)",
    "pymysql (>=1.1.0)",
    "pyodbc (>=5.0.0)",
    "pymongo (>=4.6.0)",
]

[project.scripts]
asistpy = "attendance.adapters.cli.main:main"

[tool.poetry]
packages = [{include = "attendance", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.16.5,<0.17.0)",
    "mypy (>=2.3.1,<3.0.0)"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["zk", "zk.*", "pymongo", "pymongo.*", "psycopg", "psycopg.*", "pymysql", "pymysql.*", "pyodbc", "pyodbc.*"]
ignore_missing_imports = true
